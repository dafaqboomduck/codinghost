<title>CodingHost</title>

<style>
  /* Layout: a workbook. Sticky top bar, then either a two-column home (new plan | your plans)
     or a two-column exercise sheet (task on the left, editor and results on the right). */
  :root {
    --bg: #f3f4f7;
    --surface: #ffffff;
    --sunken: #e9ebf1;
    --fg: #161a26;
    --muted: #586073;
    --border: #d6dae4;
    --accent: #2f43c9;
    --accent-fg: #ffffff;
    --accent-soft: #e3e6fa;
    --ok: #1b7444;
    --ok-soft: #dcf0e3;
    --bad: #b0233a;
    --bad-soft: #f9e1e5;
    --warn: #845400;
    --warn-soft: #f7ecd2;
    --code-bg: #fbfbfd;
    --syn-kw: #7a2bb5;
    --syn-str: #a2361e;
    --syn-num: #11698a;
    --syn-com: #707a8c;
    --syn-def: #2f43c9;
    --syn-builtin: #1b7444;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10131a; --surface: #171b24; --sunken: #0c0f15; --fg: #e5e8ef; --muted: #98a1b4;
      --border: #283043; --accent: #8e9cff; --accent-fg: #0c0f15; --accent-soft: #222a4e;
      --ok: #5ccb89; --ok-soft: #15301f; --bad: #ff7c8c; --bad-soft: #3a1a21; --warn: #e6b450; --warn-soft: #33290f;
      --code-bg: #12161e; --syn-kw: #cf9bff; --syn-str: #f0a37f; --syn-num: #6fd0f2; --syn-com: #7d879a;
      --syn-def: #8e9cff; --syn-builtin: #5ccb89;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10131a; --surface: #171b24; --sunken: #0c0f15; --fg: #e5e8ef; --muted: #98a1b4;
    --border: #283043; --accent: #8e9cff; --accent-fg: #0c0f15; --accent-soft: #222a4e;
    --ok: #5ccb89; --ok-soft: #15301f; --bad: #ff7c8c; --bad-soft: #3a1a21; --warn: #e6b450; --warn-soft: #33290f;
    --code-bg: #12161e; --syn-kw: #cf9bff; --syn-str: #f0a37f; --syn-num: #6fd0f2; --syn-com: #7d879a;
    --syn-def: #8e9cff; --syn-builtin: #5ccb89;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
  .wrap {
    max-width: 1240px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: 28px; font-weight: 700; }
  h2 { font-size: 22px; font-weight: 700; }
  h3 { font-size: 16px; font-weight: 600; font-family: var(--font-body); }
  p { margin: 0; }
  code, pre, .mono { font-family: var(--font-mono); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }

  /* Top bar */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar .wrap { display: flex; align-items: center; gap: 14px; min-height: 56px; padding-block: 8px; flex-wrap: wrap; }
  .brand {
    font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em;
    background: none; border: 0; padding: 0; color: var(--fg); cursor: pointer;
  }
  .brand span { color: var(--accent); }
  .crumb { color: var(--muted); font-size: 14px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;
    padding: 3px 10px; border-radius: 999px; background: var(--sunken); color: var(--muted); white-space: nowrap;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chip.ok { color: var(--ok); background: var(--ok-soft); }
  .chip.bad { color: var(--bad); background: var(--bad-soft); }
  .chip.warn { color: var(--warn); background: var(--warn-soft); }
  .chip.plain::before { display: none; }

  main.wrap { padding-block: 28px 64px; }

  /* Controls */
  .btn {
    font: 600 14px/1 var(--font-body); padding: 10px 16px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.secondary { background: var(--surface); color: var(--accent); border-color: var(--border); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: transparent; padding-inline: 8px; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
  .btn .kbd { font: 500 11px var(--font-mono); opacity: .75; }
  label.field { display: grid; gap: 6px; font-weight: 500; font-size: 14px; }
  input[type="text"], select {
    font: 15px var(--font-body); color: var(--fg); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 9px 11px; width: 100%;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 9px 6px; font-size: 14px; font-weight: 500; color: var(--muted); background: var(--surface); }
  .seg label + label span { border-left: 1px solid var(--border); }
  .seg input:checked + span { background: var(--accent-soft); color: var(--accent); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
  .notice { border-radius: 6px; padding: 12px 14px; font-size: 14px; background: var(--sunken); color: var(--fg); }
  .notice.bad { background: var(--bad-soft); color: var(--bad); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }

  /* Home */
  .home-head { display: grid; gap: 8px; margin-bottom: 24px; max-width: 65ch; }
  .home-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; }
  .plans { display: grid; gap: 0; }
  .plan-item {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center;
    padding: 14px 0; border-top: 1px solid var(--border);
  }
  .plan-item:first-child { border-top: 0; padding-top: 0; }
  .plan-item .title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .plan-item .meta { font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; width: 120px; max-width: 100%; }
  .meter > i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
  .tabnum { font-variant-numeric: tabular-nums; }
  .empty { display: grid; gap: 8px; padding: 18px; border: 1px dashed var(--border); border-radius: 6px; color: var(--muted); }

  /* Generating */
  .gen { max-width: 720px; display: grid; gap: 20px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--border); }
  .steps li:first-child { border-top: 0; }
  .steps .mark { font: 600 14px var(--font-mono); color: var(--muted); text-align: center; }
  .steps li.done .mark { color: var(--ok); }
  .steps li.fail .mark { color: var(--bad); }
  .steps li.active .mark { color: var(--accent); }
  .steps .sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }

  /* Exercise */
  .strip { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .step {
    min-width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    font: 600 14px var(--font-mono); color: var(--fg); cursor: pointer; padding: 0 10px; font-variant-numeric: tabular-nums;
  }
  .step.passed { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
  .step.solution { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
  .step.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .step:disabled { color: var(--muted); background: var(--sunken); border-color: transparent; cursor: not-allowed; }
  .strip .summary { margin-left: auto; font-size: 13px; color: var(--muted); }
  .ex-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; align-items: start; }
  .task { display: grid; gap: 14px; }
  .md { display: grid; gap: 10px; max-width: 65ch; overflow-wrap: anywhere; }
  .md p, .md ul, .md ol { margin: 0; }
  .md ul, .md ol { padding-left: 22px; }
  .md code { font-size: .9em; background: var(--sunken); padding: 1px 5px; border-radius: 4px; }
  .md pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 13px; }
  .md pre code { background: none; padding: 0; }
  .md h4 { margin: 0; font-size: 15px; }
  .doctest {
    margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; font: 13px/1.6 var(--font-mono); overflow-x: auto; white-space: pre;
  }
  .doctest .ps { color: var(--muted); user-select: none; }
  .work { display: grid; gap: 12px; min-width: 0; }
  .editor-box { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--code-bg); }
  .editor-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--border); font: 12px var(--font-mono); color: var(--muted); background: var(--surface); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; font-size: 14px; }

  .out { display: grid; gap: 10px; }
  .out-summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-weight: 600; }
  .out-summary .ms { font: 12px var(--font-mono); color: var(--muted); font-weight: 400; }
  .tests { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .test { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 9px 12px; border-top: 1px solid var(--border); background: var(--surface); }
  .test:first-child { border-top: 0; }
  .test .icon { font: 600 13px var(--font-mono); width: 22px; height: 22px; border-radius: 4px; display: grid; place-items: center; }
  .test.pass .icon { background: var(--ok-soft); color: var(--ok); }
  .test.fail .icon, .test.error .icon, .test.invalid .icon { background: var(--bad-soft); color: var(--bad); }
  .test .call { font: 13px var(--font-mono); overflow-wrap: anywhere; }
  .test .detail { font: 12px/1.5 var(--font-mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
  .term {
    margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
    font: 13px/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto;
  }
  .term.err { color: var(--bad); }

  .tutor { display: grid; gap: 12px; }
  .tutor-ask { display: flex; gap: 8px; flex-wrap: wrap; }
  .tutor-ask input { flex: 1 1 220px; }
  .hint { display: grid; gap: 6px; padding: 12px 14px; border-radius: 6px; background: var(--accent-soft); }
  .hint .who { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); }
  .hint .q { font-size: 13px; color: var(--muted); }
  .hint.streaming .body::after { content: "▍"; color: var(--accent); }

  .done-banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--radius); background: var(--ok-soft); color: var(--ok); font-weight: 600; }

  .complete { max-width: 720px; display: grid; gap: 20px; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .stat { display: grid; gap: 2px; padding: 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .stat b { font: 700 26px var(--font-display); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .recap { list-style: none; margin: 0; padding: 0; display: grid; }
  .recap li { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); align-items: baseline; flex-wrap: wrap; }
  .recap li:first-child { border-top: 0; }

  .toast {
    position: fixed; z-index: 30; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: min(560px, calc(100% - 32px)); padding: 12px 16px; border-radius: 6px;
    background: var(--fg); color: var(--bg); font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
  }

import ast
import builtins
import contextlib
import copy
import io
import json
import sys
import time
import traceback

_FILE = "solution.py"
_MAX_OUT = 20000


class _Timeout(BaseException):
    """Raised by the trace guard. BaseException, so `except Exception` in user code cannot swallow it."""


def _no_input(*args, **kwargs):
    raise RuntimeError("input() is not available here. Use the function's parameters instead.")


def _user_line(exc):
    if isinstance(exc, SyntaxError) and exc.filename == _FILE:
        return exc.lineno
    line = None
    for frame in traceback.extract_tb(exc.__traceback__):
        if frame.filename == _FILE:
            line = frame.lineno
    return line


def _format_exc(exc):
    if isinstance(exc, _Timeout):
        return "TimeoutError: the code ran longer than the time limit (infinite loop?)"
    frames = [f for f in traceback.extract_tb(exc.__traceback__) if f.filename == _FILE]
    head = ""
    if frames:
        head = "Traceback (most recent call last):\n" + "".join(traceback.format_list(frames))
    return head + "".join(traceback.format_exception_only(type(exc), exc)).rstrip()


def _clip(text):
    return text if len(text) <= _MAX_OUT else text[:_MAX_OUT] + "\n... output truncated ..."


def _short_repr(value, limit=300):
    try:
        text = repr(value)
    except Exception as exc:
        text = "<repr failed: %s>" % exc
    return text if len(text) <= limit else text[:limit] + "..."


def codinghost_run(code, function_name, tests_json, time_limit=0):
    """Run user code, then call function_name for each test. Returns a JSON string.

    time_limit > 0 installs a sys.settrace guard (used when Python runs on the main
    thread). In a worker the page enforces the limit by terminating the worker.
    """
    tests = json.loads(tests_json)
    out, err = io.StringIO(), io.StringIO()
    result = {"stdout": "", "stderr": "", "error": None, "error_line": None, "timed_out": False, "results": []}
    ns = {"__name__": "__main__", "__builtins__": builtins, "input": _no_input}

    if time_limit and time_limit > 0:
        deadline = time.monotonic() + time_limit

        def guard(frame, event, arg):
            if time.monotonic() > deadline:
                raise _Timeout()
            return guard

        sys.settrace(guard)
    try:
        with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):
            try:
                exec(compile(code, _FILE, "exec"), ns)
            except _Timeout as exc:
                result["error"] = _format_exc(exc)
                result["timed_out"] = True
            except BaseException as exc:
                result["error"] = _format_exc(exc)
                result["error_line"] = _user_line(exc)

            fn = ns.get(function_name)
            if result["error"] is None and not callable(fn):
                result["error"] = "NameError: define a function named '%s'" % function_name

            if result["error"] is None:
                for index, test in enumerate(tests):
                    item = {
                        "index": index,
                        "hidden": bool(test.get("hidden")),
                        "args": test.get("args_py", ""),
                        "expected": test.get("expected_py", ""),
                        "actual": None,
                        "status": "pass",
                        "message": None,
                        "line": None,
                    }
                    try:
                        args = ast.literal_eval(test["args_py"])
                        if not isinstance(args, tuple):
                            args = (args,)
                        expected = ast.literal_eval(test["expected_py"])
                    except Exception as exc:
                        item["status"] = "invalid"
                        item["message"] = "Bad test definition: %s" % exc
                        result["results"].append(item)
                        continue
                    try:
                        actual = fn(*copy.deepcopy(args))
                    except _Timeout as exc:
                        item["status"] = "error"
                        item["message"] = _format_exc(exc)
                        result["results"].append(item)
                        result["timed_out"] = True
                        break
                    except BaseException as exc:
                        item["status"] = "error"
                        item["message"] = _format_exc(exc)
                        item["line"] = _user_line(exc)
                    else:
                        item["actual"] = _short_repr(actual)
                        try:
                            same = bool(actual == expected)
                        except Exception:
                            same = False
                        if not same:
                            item["status"] = "fail"
                    result["results"].append(item)
    finally:
        sys.settrace(None)

    result["stdout"] = _clip(out.getvalue())
    result["stderr"] = _clip(err.getvalue())
    if result["timed_out"] and result["error"] is None:
        result["error"] = "TimeoutError: the code ran longer than the time limit (infinite loop?)"
    return json.dumps(result)

<script>
(function () {
  "use strict";

  /* ================================================================
   * config
   * ================================================================ */
  const RUN_TIMEOUT_MS = 5000;
  const LOAD_TIMEOUT_MS = 90000;
  const SAVE_DEBOUNCE_MS = 2000;
  const MIN_EXERCISES = 3;
  const SOLUTION_AFTER = 3; // hints used or failed submits before "Show solution" appears
  // The artifact sandbox blocks runtime fetches from CDNs, so Pyodide's core files are
  // published next to this page (see scripts/vendor-pyodide.sh).
  const PYODIDE_BASE = new URL("pyodide/", location.href).href;
  const HARNESS = document.getElementById("py-harness").textContent;
  const DEV = !(window.claude && window.claude.use) && new URLSearchParams(location.search).has("dev");

  /* ================================================================
   * helpers
   * ================================================================ */
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Small Markdown renderer. Everything is escaped first; only the tags added here reach the DOM.
  function mdInline(text) {
    return text.split(/(`[^`\n]+`)/g).map((part) => {
      if (part.length > 1 && part.startsWith("`") && part.endsWith("`")) return "<code>" + esc(part.slice(1, -1)) + "</code>";
      return esc(part)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
    }).join("");
  }
  function md(src) {
    const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
    const out = [];
    let para = [];
    let list = null;
    const flushPara = () => { if (para.length) { out.push("<p>" + mdInline(para.join(" ")) + "</p>"); para = []; } };
    const flushList = () => { if (list) { out.push("<" + list.tag + ">" + list.items.map((i) => "<li>" + mdInline(i) + "</li>").join("") + "</" + list.tag + ">"); list = null; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (/^\s*```/.test(line)) {
        flushPara(); flushList();
        const code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
        out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      const heading = line.match(/^#{1,6}\s+(.*)$/);
      const bullet = line.match(/^\s*[-*]\s+(.*)$/);
      const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (heading) { flushPara(); flushList(); out.push("<h4>" + mdInline(heading[1]) + "</h4>"); }
      else if (bullet || numbered) {
        flushPara();
        const tag = bullet ? "ul" : "ol";
        if (list && list.tag !== tag) flushList();
        if (!list) list = { tag, items: [] };
        list.items.push((bullet || numbered)[1]);
      } else if (!line.trim()) { flushPara(); flushList(); }
      else { flushList(); para.push(line.trim()); }
    }
    flushPara(); flushList();
    const box = h("div", { class: "md" });
    box.innerHTML = out.join("");
    return box;
  }

  let toastTimer = null;
  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 5000);
  }

  function newId(prefix) {
    return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function callText(fn, argsPy) {
    const a = String(argsPy || "").trim();
    if (!a.startsWith("(")) return fn + "(" + a + ")";
    return fn + a.replace(/,\s*\)$/, ")");
  }

  /* ================================================================
   * runner: Pyodide in a Web Worker, main-thread fallback
   * ================================================================ */

  // Artifacts do not serve .zip, so the stdlib ships as base64 text and loads through stdLibURL.
  // This function is also copied into the worker source with toString().
  async function stdlibBlobURL(base) {
    const res = await fetch(base + "python_stdlib.zip.b64.txt");
    if (!res.ok) throw new Error("Python standard library could not be loaded (HTTP " + res.status + ")");
    const bin = atob((await res.text()).trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "application/zip" }));
  }

  const WORKER_SRC = stdlibBlobURL.toString() + `
    let runFn = null;
    self.onmessage = async (e) => {
      const m = e.data;
      if (m.type === "init") {
        try {
          importScripts(m.base + "pyodide.js");
          const py = await loadPyodide({ indexURL: m.base, stdLibURL: await stdlibBlobURL(m.base) });
          py.runPython(m.harness);
          runFn = py.globals.get("codinghost_run");
          postMessage({ type: "ready" });
        } catch (err) {
          postMessage({ type: "init_error", error: String((err && err.message) || err) });
        }
      } else if (m.type === "run") {
        let json;
        try {
          json = runFn(m.code, m.fn, JSON.stringify(m.tests), 0);
        } catch (err) {
          json = JSON.stringify({ stdout: "", stderr: "", error: "Runner error: " + String((err && err.message) || err), results: [] });
        }
        postMessage({ type: "result", id: m.id, json });
      }
    };`;

  const runner = (() => {
    let mode = null;
    let worker = null;
    let mainRun = null;
    let ready = null;
    let queue = Promise.resolve();
    let seq = 0;
    const pending = new Map();
    const listeners = new Set();
    let status = { state: "loading", detail: "" };
    let workerURL = null;

    function setStatus(state, detail) {
      status = { state, detail: detail || "", mode };
      listeners.forEach((fn) => {
        try { fn(status); } catch (e) { console.error("CodingHost: status listener failed", e); }
      });
    }

    function spawnWorker() {
      workerURL = workerURL || URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
      return new Promise((resolve, reject) => {
        const w = new Worker(workerURL);
        const timer = setTimeout(() => { w.terminate(); reject(new Error("Python took too long to load.")); }, LOAD_TIMEOUT_MS);
        w.onmessage = (e) => {
          if (e.data.type === "ready") { clearTimeout(timer); resolve(w); }
          else if (e.data.type === "init_error") { clearTimeout(timer); w.terminate(); reject(new Error(e.data.error)); }
        };
        w.onerror = (e) => { clearTimeout(timer); w.terminate(); reject(new Error(e.message || "The Python worker failed to start.")); };
        w.postMessage({ type: "init", base: PYODIDE_BASE, harness: HARNESS });
      });
    }

    async function startWorker() {
      const w = await spawnWorker();
      w.onmessage = (e) => {
        if (e.data.type !== "result") return;
        const done = pending.get(e.data.id);
        if (done) { pending.delete(e.data.id); done(JSON.parse(e.data.json)); }
      };
      worker = w;
      mode = "worker";
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error("Could not load " + src));
        document.head.append(s);
      });
    }

    async function startMain() {
      if (typeof window.loadPyodide !== "function") await loadScript(PYODIDE_BASE + "pyodide.js");
      const py = await window.loadPyodide({ indexURL: PYODIDE_BASE, stdLibURL: await stdlibBlobURL(PYODIDE_BASE) });
      py.runPython(HARNESS);
      mainRun = py.globals.get("codinghost_run");
      mode = "main";
    }

    function start() {
      setStatus("loading");
      ready = (async () => {
        try {
          await startWorker();
        } catch (workerErr) {
          console.warn("CodingHost: worker runner failed, using the main thread.", workerErr);
          try {
            await startMain();
          } catch (mainErr) {
            setStatus("failed", mainErr.message);
            throw mainErr;
          }
        }
        setStatus("ready");
      })();
      ready.catch(() => {});
      return ready;
    }

    function restartWorker() {
      if (worker) worker.terminate();
      worker = null;
      pending.clear();
      ready = startWorker().then(() => setStatus("ready"), (e) => { setStatus("failed", e.message); throw e; });
      ready.catch(() => {});
      setStatus("loading");
    }

    const timeoutResult = (ms) => ({
      stdout: "", stderr: "", results: [], error_line: null, timed_out: true, ms,
      error: "TimeoutError: the code ran longer than " + ms / 1000 + " s (infinite loop?)",
    });

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const failResult = (msg, ms) => ({ stdout: "", stderr: "", results: [], error_line: null, timed_out: false, ms, error: msg });
    let stage = "idle";

    // One run at a time. Resolves with the harness result, never rejects unless Python failed to load.
    // Every wait below is capped, so a run that went wrong ends with a message instead of hanging.
    function run(code, fn, tests, timeoutMs = RUN_TIMEOUT_MS) {
      const prev = queue;
      const job = (async () => {
        stage = "waiting for an earlier run to finish";
        await Promise.race([prev, sleep(timeoutMs + 3000)]);
        stage = "waiting for Python to load";
        await Promise.race([ready, sleep(LOAD_TIMEOUT_MS).then(() => { throw new Error("Python did not finish loading."); })]);
        const t0 = performance.now();
        if (mode === "main") {
          stage = "running tests on the main thread";
          await sleep(20); // let the UI paint "Running" first
          const res = JSON.parse(mainRun(code, fn, JSON.stringify(tests), timeoutMs / 1000));
          res.ms = performance.now() - t0;
          return res;
        }
        stage = "waiting for the Python worker to answer";
        return new Promise((resolve) => {
          const id = ++seq;
          let timer = null;
          const finish = (res) => {
            clearTimeout(timer);
            pending.delete(id);
            res.ms = performance.now() - t0;
            resolve(res);
          };
          timer = setTimeout(() => {
            finish(timeoutResult(timeoutMs)); // settle first, then restart, so a restart problem cannot leave the run hanging
            try { restartWorker(); } catch (e) { console.error("CodingHost: worker restart failed", e); setStatus("failed", (e && e.message) || String(e)); }
          }, timeoutMs);
          pending.set(id, finish);
          try {
            worker.postMessage({ type: "run", id, code, fn, tests });
          } catch (e) {
            finish(failResult("Could not send the tests to Python: " + ((e && e.message) || e)));
          }
        });
      })();
      queue = job.catch(() => {});
      return job;
    }

    return {
      start,
      run,
      whenReady() { return ready; },
      get stage() { return stage; },
      get status() { return status; },
      onStatus(fn) { listeners.add(fn); fn(status); return () => listeners.delete(fn); },
    };
  })();

  /* ================================================================
   * caps: claude.ai capabilities (and the local dev shim)
   * ================================================================ */
  async function resolveCaps() {
    if (DEV) return devCaps();
    if (!(window.claude && window.claude.use)) return { sample: null, db: null, user: null };
    const [sample, db, user] = await Promise.all([
      window.claude.use("sample").catch(() => null),
      window.claude.use("db").catch(() => null),
      window.claude.use("user").catch(() => null),
    ]);
    return { sample, db, user };
  }

  // Local-only stand-ins for sample, db and user. Active with ?dev when window.claude is absent.
  function devCaps() {
    const KEY = "codinghost-dev-db";
    const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
    const save = (all) => { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) { /* ignore */ } };
    const snap = (path, data) => ({ id: path.split("/").pop(), exists: data !== undefined, data: () => (data === undefined ? undefined : JSON.parse(JSON.stringify(data))) });
    const db = {
      doc(path) {
        return {
          path,
          async get() { return snap(path, load()[path]); },
          async set(data) { const all = load(); all[path] = JSON.parse(JSON.stringify(data)); save(all); },
          async update(data) { const all = load(); all[path] = Object.assign({}, all[path] || {}, JSON.parse(JSON.stringify(data))); save(all); },
          async delete() { const all = load(); delete all[path]; save(all); },
        };
      },
      collection(path) {
        return {
          path,
          async get() {
            const all = load();
            const docs = Object.keys(all)
              .filter((p) => p.startsWith(path + "/") && !p.slice(path.length + 1).includes("/"))
              .map((p) => snap(p, all[p]));
            return { docs, size: docs.length, empty: docs.length === 0 };
          },
        };
      },
    };
    let canned = null;
    const getCanned = async () => canned || (canned = await (await fetch("dev/sample-plan.json")).json());
    const sample = async (input, opts = {}) => {
      const text = "Look at what your loop does with each item. **Which variable** holds the answer, and do you return it at the end? Try printing it inside the loop with `print(...)` to see how it changes.";
      let acc = "";
      for (const word of text.split(" ")) {
        await new Promise((r) => setTimeout(r, 25));
        acc += (acc ? " " : "") + word;
        if (opts.onText) opts.onText({ text: acc, delta: word });
      }
      return { text: acc, truncated: false, modelTierApplied: "default" };
    };
    sample.json = async (input, opts = {}) => {
      const plan = await getCanned();
      await new Promise((r) => setTimeout(r, 400));
      if (String(input).includes("failed an automatic check")) {
        const id = (String(input).match(/"id":\s*"(ex\d+)"/) || [])[1];
        if (plan._dev_repairs && plan._dev_repairs[id]) return JSON.parse(JSON.stringify(plan._dev_repairs[id]));
        throw { code: "invalid_json", message: "Dev shim has no repair for " + id };
      }
      if (opts.onText) opts.onText({ text: JSON.stringify(plan), delta: "" });
      return JSON.parse(JSON.stringify(plan));
    };
    sample.limits = async () => ({ maxPromptBytes: 100000 });
    const user = { id: async () => "dev-user", me: async () => ({ id: "dev-user", name: "Dev" }) };
    return { sample, db, user };
  }

  /* ================================================================
   * store: everything in db, private under data/users/<uid>/
   * ================================================================ */
  const store = (() => {
    let db = null;
    let base = null;
    const inflight = new Map(); // path -> { running: Promise, next: data|null }

    function init(dbNs, uid) {
      db = dbNs;
      base = "data/users/" + uid + "/profile";
    }

    // One write at a time per document. A write that arrives while one is running replaces
    // any queued write, so only the latest state is sent.
    function write(path, data) {
      const slot = inflight.get(path);
      if (slot) { slot.next = data; return slot.done; }
      const entry = { next: null, done: null };
      entry.done = (async () => {
        let current = data;
        try {
          while (current) {
            await db.doc(path).set(current);
            current = entry.next;
            entry.next = null;
          }
        } finally {
          inflight.delete(path);
        }
      })();
      inflight.set(path, entry);
      return entry.done;
    }

    // Saved documents can come back read-only (frozen), but the page edits plans and progress in place, so hand out plain copies.
    const thaw = (value) => (value == null ? value : JSON.parse(JSON.stringify(value)));
    const plain = (snap) => (snap && snap.exists ? thaw(snap.data()) : null);

    return {
      init,
      async getProfile() { return plain(await db.doc(base).get()); },
      saveProfile(data) { return write(base, data); },
      async listPlans() {
        const [plans, progress] = await Promise.all([
          db.collection(base + "/plans").get(),
          db.collection(base + "/progress").get(),
        ]);
        const prog = new Map(progress.docs.map((d) => [d.id, thaw(d.data())]));
        return plans.docs
          .map((d) => ({ plan: thaw(d.data()), progress: prog.get(d.id) || null }))
          .filter((x) => x.plan && Array.isArray(x.plan.exercises))
          .sort((a, b) => String((b.progress && b.progress.updated_at) || b.plan.created_at).localeCompare(String((a.progress && a.progress.updated_at) || a.plan.created_at)));
      },
      async getPlan(id) { return plain(await db.doc(base + "/plans/" + id).get()); },
      savePlan(plan) { return write(base + "/plans/" + plan.id, plan); },
      async getProgress(id) { return plain(await db.doc(base + "/progress/" + id).get()); },
      saveProgress(id, progress) { return write(base + "/progress/" + id, progress); },
    };
  })();

  function dbErrorMessage(e) {
    const code = e && e.code;
    if (code === "quota_exceeded") return "Storage is full. Your latest change was not saved.";
    if (code === "not_granted" || code === "revoked") return "This page lost access to your saved data. Reload to allow it again.";
    if (code === "unavailable" || code === "resource_exhausted") return "Saving failed for a moment. Your next change will try again.";
    return "Saving failed: " + ((e && e.message) || String(e));
  }

  /* ================================================================
   * ai: plan generation, repair and tutoring through sample
   * ================================================================ */
  const ai = (() => {
    let sample = null;
    let limits = null;

    const PLAN_SHAPE = `{
  "topic": "string",
  "level": "beginner | intermediate | advanced",
  "summary": "1-2 sentences on what the learner practices",
  "exercises": [
    {
      "id": "ex1",
      "title": "short title",
      "concept": "the one concept this exercise teaches",
      "prompt_md": "the task in Markdown",
      "function_name": "snake_case_name",
      "starter_code": "def snake_case_name(a, b):\\n    \\"\\"\\"One-line docstring.\\"\\"\\"\\n    pass\\n",
      "reference_solution": "def snake_case_name(a, b):\\n    return a + b\\n",
      "tests": [
        { "args_py": "(2, 3)", "expected_py": "5", "hidden": false }
      ]
    }
  ]
}`;

    const RULES = (level) => `Rules:
- Every exercise asks the learner to write ONE function, named in "function_name". No classes, no input(), no printing required, no files or network. Standard library only.
- "starter_code" is the def line with its parameters, a one-line docstring, and \`pass\`.
- "reference_solution" is a complete, correct implementation of the same function.
- 3 to 6 tests per exercise: at least 2 with "hidden": false and at least 1 with "hidden": true.
- "args_py" is a Python tuple literal of the positional arguments, for example "(2, 3)", or "([1, 2, 3],)" for one argument. "expected_py" is a Python literal of the return value. Use only literals: numbers, strings, booleans, None, lists, tuples, dicts, sets.
- Avoid float results unless the task says to round with round(x, 2). Avoid results with undefined order: ask for sorted lists instead.
- "prompt_md" explains the task in 2 to 5 sentences of Markdown. It names the function and its parameters, says what it returns, and shows one example call in inline code.
- Write for a ${level} learner.`;

    function planPrompt(topic, level, count) {
      return `You write short Python practice courses for an in-browser coding tutor.

Topic: ${topic}
Learner level: ${level}
Number of exercises: ${count}

Write exactly ${count} exercises about the topic, ordered from easiest to hardest. Each exercise teaches one concept. Use ids "ex1", "ex2", and so on.

Reply with only one JSON object of this shape:
${PLAN_SHAPE}

${RULES(level)}`;
    }

    function repairPrompt(ex, problem, level) {
      return `This exercise for a Python practice course failed an automatic check.

Problem: ${problem}

Exercise JSON:
${JSON.stringify(ex, null, 2)}

Fix the exercise so that its "reference_solution" passes every test and all rules hold. Fix whichever part is wrong: the tests, the solution, or the task text. Keep the same "id" and the same topic.

${RULES(level)}

Reply with only the corrected exercise as one JSON object with the same fields as above.`;
    }

    function summarizeRun(run, exercise) {
      if (!run) return "Not run yet.";
      const parts = [];
      if (run.error) parts.push("Error:\n" + run.error);
      const visible = (run.results || []).filter((r) => !r.hidden);
      const failed = visible.filter((r) => r.status !== "pass");
      const hiddenFailed = (run.results || []).filter((r) => r.hidden && r.status !== "pass").length;
      if (run.results && run.results.length) {
        parts.push(`${(run.results || []).filter((r) => r.status === "pass").length} of ${run.results.length} tests passed.`);
      }
      for (const r of failed) {
        const call = callText(exercise.function_name, r.args);
        if (r.status === "fail") parts.push(`${call} returned ${r.actual}, expected ${r.expected}`);
        else parts.push(`${call} raised:\n${r.message}`);
      }
      if (hiddenFailed) parts.push(`${hiddenFailed} hidden test(s) failed (inputs not shown).`);
      if (run.stdout) parts.push("Printed output:\n" + run.stdout.slice(0, 1500));
      return parts.join("\n\n") || "All tests passed.";
    }

    function helpPrompt({ exercise, code, run, level, question }) {
      return `You are a patient Python tutor inside a practice app. The learner is working on one exercise and asked for help.

How to answer:
- This is hint level ${level} of 3. Level 1: a conceptual nudge, no code. Level 2: point at the specific line or mistake in their code, without giving fixed code. Level 3: a small code fragment of at most 3 lines that shows the idea, not the whole function.
- Never write the complete solution, unless the learner's question explicitly asks for the full solution.
- If their code raised an error, first explain the error message in plain words.
- If their code already looks correct, say so and suggest what to check.
- Keep it under 120 words. Use Markdown and put code in backticks.

Exercise: ${exercise.title}
Concept: ${exercise.concept}
Task:
${exercise.prompt_md}

Learner's code:
\`\`\`python
${code}
\`\`\`

Last run:
${summarizeRun(run, exercise)}

Learner's question: ${question ? question : "(none) Give the next hint."}`;
    }

    async function checkSize(prompt) {
      try { limits = limits || (await sample.limits()); } catch (e) { limits = { maxPromptBytes: Infinity }; }
      const bytes = new TextEncoder().encode(prompt).length;
      if (bytes > limits.maxPromptBytes) throw { code: "prompt_too_large", message: "This request is too long to send to Claude. Shorten your code or question." };
    }

    return {
      init(s) { sample = s; },
      get available() { return !!sample; },
      async generatePlan(topic, level, count, opts) {
        const prompt = planPrompt(topic, level, count);
        await checkSize(prompt);
        return sample.json(prompt, Object.assign({ modelTier: "complex" }, opts));
      },
      async repairExercise(ex, problem, level, opts) {
        const prompt = repairPrompt(ex, problem, level);
        await checkSize(prompt);
        return sample.json(prompt, Object.assign({ modelTier: "default" }, opts));
      },
      async help(args, opts) {
        const prompt = helpPrompt(args);
        await checkSize(prompt);
        return sample(prompt, Object.assign({ modelTier: "default", cache: false }, opts));
      },
    };
  })();

  function aiErrorMessage(e) {
    const code = e && e.code;
    if (code === "not_granted") return "Claude access was declined for this page. Reload the page to allow it.";
    if (code === "rate_limited" || code === "queue_overflow") return "Slow down, try again in a minute.";
    if (code === "invalid_json") return "Claude's reply was not usable plan data. Try again.";
    if (code === "prompt_too_large") return e.message;
    if (code === "cancelled") return "Cancelled.";
    if (code === "refused") return "Claude declined this request. Try a different topic.";
    if (code === "session_expired") return "Your claude.ai session expired. Reload the page.";
    return "Claude could not answer: " + ((e && e.message) || String(e));
  }

  /* ================================================================
   * plan checks
   * ================================================================ */
  const IDENT = /^[A-Za-z_][A-Za-z0-9_]*$/;

  // Returns a list of problems. Also normalizes small issues in place (hidden flags, test count).
  function exerciseProblems(ex) {
    const problems = [];
    if (!ex || typeof ex !== "object") return ["The exercise is not an object."];
    for (const f of ["title", "concept", "prompt_md", "function_name", "starter_code", "reference_solution"]) {
      if (typeof ex[f] !== "string" || !ex[f].trim()) problems.push(`Field "${f}" is missing or empty.`);
    }
    if (typeof ex.function_name === "string" && !IDENT.test(ex.function_name)) problems.push(`"function_name" is not a valid Python name.`);
    if (!Array.isArray(ex.tests)) {
      problems.push(`"tests" is not a list.`);
      return problems;
    }
    ex.tests = ex.tests.filter((t) => t && typeof t.args_py === "string" && typeof t.expected_py === "string")
      .map((t) => ({ args_py: t.args_py, expected_py: t.expected_py, hidden: !!t.hidden }));
    if (ex.tests.length > 6) {
      const hidden = ex.tests.filter((t) => t.hidden);
      const visible = ex.tests.filter((t) => !t.hidden);
      ex.tests = visible.slice(0, Math.max(2, 6 - Math.min(hidden.length, 2))).concat(hidden.slice(0, 2)).slice(0, 6);
    }
    if (ex.tests.length < 3) problems.push("It needs at least 3 tests.");
    else {
      if (!ex.tests.some((t) => t.hidden)) ex.tests[ex.tests.length - 1].hidden = true;
      if (ex.tests.filter((t) => !t.hidden).length < 1) ex.tests[0].hidden = false;
    }
    return problems;
  }

  function failureText(res) {
    if (res.error) return "Running the reference solution raised: " + res.error;
    const bad = (res.results || []).filter((r) => r.status !== "pass");
    return bad.map((r) => {
      if (r.status === "fail") return `Test args ${r.args}: reference solution returned ${r.actual}, but expected_py is ${r.expected}.`;
      return `Test args ${r.args}: ${r.message}`;
    }).join("\n");
  }

  // Shape check, then run the reference solution against all tests. One repair call per failed exercise.
  async function validatePlan(raw, level, report, signal) {
    if (!raw || typeof raw !== "object" || !Array.isArray(raw.exercises)) throw { code: "invalid_json", message: "The plan has no exercise list." };
    const kept = [];
    for (let i = 0; i < raw.exercises.length; i++) {
      let ex = raw.exercises[i];
      const label = (ex && ex.title) || "Exercise " + (i + 1);
      report(i, "active", label, "Checking the reference solution against its tests");
      let problem = await checkExercise(ex);
      if (problem && !signal.aborted) {
        report(i, "active", label, "Check failed, asking Claude for a fix");
        try {
          const fixed = await ai.repairExercise(ex, problem, level, { signal });
          problem = await checkExercise(fixed);
          if (!problem) ex = fixed;
        } catch (e) {
          if (e && e.code === "cancelled") throw e;
          problem = problem + " (repair failed: " + aiErrorMessage(e) + ")";
        }
      }
      if (signal.aborted) throw { code: "cancelled", message: "Cancelled." };
      if (problem) {
        report(i, "fail", label, "Dropped: " + problem.split("\n")[0]);
      } else {
        report(i, "done", ex.title, `Reference solution passes all ${ex.tests.length} tests`);
        kept.push(ex);
      }
    }
    kept.forEach((ex, i) => { ex.id = "ex" + (i + 1); });
    return kept;
  }

  async function checkExercise(ex) {
    const problems = exerciseProblems(ex);
    if (problems.length) return problems.join(" ");
    const res = await runner.run(ex.reference_solution, ex.function_name, ex.tests, 8000);
    const ok = !res.error && res.results.length === ex.tests.length && res.results.every((r) => r.status === "pass");
    return ok ? null : failureText(res);
  }

  /* ================================================================
   * progress helpers
   * ================================================================ */
  function newProgress(plan) {
    const exercises = {};
    plan.exercises.forEach((ex, i) => {
      exercises[ex.id] = { status: i === 0 ? "open" : "locked", code: ex.starter_code, attempts: 0, hints_used: 0, passed_at: null };
    });
    return { plan_id: plan.id, current_index: 0, unlocked_index: 0, exercises, updated_at: new Date().toISOString() };
  }

  function exState(ex) {
    const p = S.progress.exercises;
    if (!p[ex.id]) p[ex.id] = { status: "locked", code: ex.starter_code, attempts: 0, hints_used: 0, passed_at: null };
    return p[ex.id];
  }

  const isDone = (st) => st.status === "passed" || st.status === "solution_shown";

  function countDone(plan, progress) {
    if (!progress) return 0;
    return plan.exercises.filter((ex) => progress.exercises[ex.id] && isDone(progress.exercises[ex.id])).length;
  }

  function saveProgressNow() {
    clearTimeout(saveTimer);
    saveTimer = null;

    S.progress.updated_at = new Date().toISOString();

  function saveProgressSoon() {

  /* ================================================================

  async function startGeneration(topic, level, count) {
    const controller = new AbortController();
    let phase = "ai";
    S.gen = { topic, level, count, controller, steps: [{ label: "Claude writes " + count + " exercises", sub: "Waiting for Claude", state: "active" }], error: null };
    setCrumb("New plan: " + topic);
    renderGenerating();
    try {
      let chars = 0;
      const raw = await ai.generatePlan(topic, level, count, {
        signal: controller.signal,
        onText: ({ text }) => {
          chars = text.length;
          S.gen.steps[0].sub = "Writing… " + chars.toLocaleString() + " characters so far";
          renderGenerating();
        },
      });
      if (S.gen.controller !== controller) return;
      const n = raw && Array.isArray(raw.exercises) ? raw.exercises.length : 0;
      S.gen.steps[0] = { label: "Claude wrote " + n + " exercises", sub: (raw && raw.summary) || "", state: "done" };
      renderGenerating();
      await runner.whenReady().catch(() => { throw { code: "python", message: "Python could not load, so exercises cannot be checked. " + runner.status.detail }; });
      const exercises = await validatePlan(raw, level, (i, state, label, sub) => {
        S.gen.steps[i + 1] = { label: label, sub, state };
        renderGenerating();
      }, controller.signal);
      if (S.gen.controller !== controller) return;
      if (exercises.length < MIN_EXERCISES) {
        throw { code: "too_few", message: `Only ${exercises.length} of ${n} exercises passed the checks. That is too few for a plan.` };
      }
      const plan = {
        id: newId("p"),
        topic: String(raw.topic || topic).slice(0, 200),
        level,
        summary: String(raw.summary || ""),
        exercises,
        created_at: new Date().toISOString(),
      };
      const progress = newProgress(plan);
      phase = "save";
      await store.savePlan(plan);
      await store.saveProgress(plan.id, progress);
      store.saveProfile({ last_plan_id: plan.id, updated_at: new Date().toISOString() }).catch(() => {});
      S.gen = null;
      openPlan(plan, progress);
    } catch (e) {
      if (!S.gen || S.gen.controller !== controller) return;
      if (e && e.code === "cancelled") { goHome(); return; }
      if (e && (e.code === "too_few" || e.code === "python")) S.gen.error = e.message;
      else S.gen.error = phase === "save" ? dbErrorMessage(e) : aiErrorMessage(e);
      if (e && e.code === "not_granted") ai.init(null);
      renderGenerating();
    }

    });

    renderStrip();
    renderBanner();
    renderActions();
    renderOutput();
    renderTutor();
    window.scrollTo({ top: 0 });
  }

  function renderStrip() {
    const strip = document.getElementById("strip");
    if (!strip) return;
    strip.textContent = "";
    S.plan.exercises.forEach((ex, i) => {
      const st = exState(ex);
      const cls = ["step", st.status === "passed" ? "passed" : st.status === "solution_shown" ? "solution" : "", i === S.index ? "current" : ""].join(" ");
      const stateLabel = st.status === "locked" ? "locked" : st.status === "passed" ? "passed" : st.status === "solution_shown" ? "completed with solution" : "open";
      strip.append(h("button", {
        class: cls, type: "button", disabled: st.status === "locked",
        "aria-current": i === S.index ? "step" : null,
        "aria-label": "Exercise " + (i + 1) + ", " + ex.title + ", " + stateLabel,
        title: ex.title + " (" + stateLabel + ")",
        onclick: () => openExercise(i),
        text: String(i + 1),
      }));
    });
    const done = countDone(S.plan, S.progress);
    strip.append(h("span", { class: "summary tabnum", text: done + " of " + S.plan.exercises.length + " done · " + S.plan.level }));
  }

  function planComplete() {
    return S.plan.exercises.every((ex) => isDone(exState(ex)));
  }

  function renderBanner() {
    const el = document.getElementById("banner");
    if (!el) return;
    el.textContent = "";
    if (planComplete()) {
      el.append(h("div", { class: "done-banner", style: "margin-bottom: 18px" },
        h("span", { text: "Plan complete." }),
        h("span", { class: "spacer" }),
        h("button", { class: "btn", type: "button", onclick: renderComplete, text: "See summary" }),
      ));
    }
  }

  function renderActions() {
    const el = document.getElementById("actions");
    if (!el) return;
    const ex = S.plan.exercises[S.index];
    const st = exState(ex);
    const pyReady = runner.status.state === "ready";
    const busy = S.running || !pyReady;
    el.textContent = "";
    const next = S.plan.exercises[S.index + 1];
    const row = h("div", { class: "actions" },
      h("button", { class: "btn secondary", type: "button", disabled: busy, onclick: () => doRun(false) }, "Run", h("span", { class: "kbd", text: "Ctrl+↵" })),
      h("button", { class: "btn", type: "button", disabled: busy, onclick: () => doRun(true) }, "Submit", h("span", { class: "kbd", text: "Ctrl+Shift+↵" })),
      isDone(st) && next ? h("button", { class: "btn secondary", type: "button", onclick: () => openExercise(S.index + 1), text: "Next exercise →" }) : null,
      h("span", { class: "spacer" }),
      h("button", { class: "btn ghost", type: "button", onclick: () => { S.confirm = "reset"; renderActions(); }, text: "Reset code" }),
    );
    el.append(row);
    if (!pyReady) {
      el.append(h("div", { class: "notice " + (runner.status.state === "failed" ? "bad" : "warn"), text: runner.status.state === "failed" ? "Python could not load: " + runner.status.detail : "Loading Python… the first load takes a few seconds." }));
    }
    if (S.confirm === "reset") {
      el.append(h("div", { class: "confirm" },
        h("span", { text: "Replace your code with the starter code?" }),
        h("span", { class: "spacer" }),
        h("button", { class: "btn danger", type: "button", onclick: () => { editor.setValue(ex.starter_code); S.confirm = null; renderActions(); saveProgressNow(); }, text: "Reset" }),
        h("button", { class: "btn secondary", type: "button", onclick: () => { S.confirm = null; renderActions(); }, text: "Cancel" }),
      ));
    }
  }

  function clearErrorLine() {
    if (editor && editor._errLine != null) {
      editor.removeLineClass(editor._errLine, "background", "cm-errline");
      editor._errLine = null;
    }
  }

  function markErrorLine(line) {
    clearErrorLine();
    if (!editor || !line || line < 1 || line > editor.lineCount()) return;
    editor._errLine = line - 1;
    editor.addLineClass(line - 1, "background", "cm-errline");
  }

  async function doRun(isSubmit) {
    if (S.running || runner.status.state !== "ready" || !S.plan) return;
    const ex = S.plan.exercises[S.index];
    const exIndex = S.index;
    const code = editor.getValue();
    const tests = isSubmit ? ex.tests : ex.tests.filter((t) => !t.hidden);
    S.running = true;
    renderActions();
    const out = document.getElementById("output");
    out.textContent = "";
    out.append(h("div", { class: "out-summary muted", text: isSubmit ? "Running all tests…" : "Running…" }));
    let res;
    let watchdog = null;
    try {
      res = await Promise.race([
        runner.run(code, ex.function_name, tests),
        new Promise((resolve) => {
          watchdog = setTimeout(() => resolve({ error: "The test runner did not answer (stuck while " + runner.stage + "). Reload the page and try again.", results: [], stdout: "", stderr: "" }), RUN_TIMEOUT_MS + 20000);
        }),
      ]);
    } catch (e) {
      res = { error: "Python is not available: " + ((e && e.message) || e), results: [], stdout: "", stderr: "" };
    }
    clearTimeout(watchdog);
    S.running = false;
    try {
      showRunResult(res, isSubmit, ex, exIndex, code);
    } catch (e) {
      console.error("CodingHost: could not show the results", e);
      try { renderActions(); } catch (e2) { /* ignore */ }
      const out = document.getElementById("output");
      if (out) {
        out.textContent = "";
        out.append(h("pre", { class: "term err", text: "The page hit an error while showing the results: " + ((e && e.message) || e) }));
      }
    }
  }

  function showRunResult(res, isSubmit, ex, exIndex, code) {
    res.submit = isSubmit;
    S.lastRun[ex.id] = res;
    if (S.index !== exIndex || !S.plan) return;

    const st = exState(ex);
    st.code = code;
    if (isSubmit) {
      const allPass = !res.error && res.results.length === ex.tests.length && res.results.every((r) => r.status === "pass");
      res.allPass = allPass;
      if (allPass) {
        if (st.status !== "passed") { st.status = "passed"; st.passed_at = new Date().toISOString(); }
        unlockNext(exIndex);
      } else {
        st.attempts = (st.attempts || 0) + 1;
      }
    }
    saveProgressNow();
    markErrorLine(res.error_line || ((res.results || []).find((r) => r.line) || {}).line);
    renderStrip();
    renderBanner();
    renderActions();
    renderOutput();
    renderTutor();
  }

  function unlockNext(i) {
    const next = S.plan.exercises[i + 1];
    if (next && exState(next).status === "locked") exState(next).status = "open";
    S.progress.unlocked_index = Math.max(S.progress.unlocked_index || 0, Math.min(i + 1, S.plan.exercises.length - 1));
  }

  function renderOutput() {
    const el = document.getElementById("output");
    if (!el) return;
    const ex = S.plan.exercises[S.index];
    const res = S.lastRun[ex.id];
    const st = exState(ex);
    el.textContent = "";
    if (!res) {
      if (isDone(st)) el.append(h("div", { class: "notice ok", text: st.status === "passed" ? "You passed this exercise. Run it again any time." : "Completed with the solution shown." }));
      return;
    }
    const results = res.results || [];
    const passed = results.filter((r) => r.status === "pass").length;
    const failed = results.length - passed;
    const ms = res.ms != null ? Math.round(res.ms) + " ms" : "";
    let summary;
    if (res.timed_out) summary = h("span", { class: "chip bad plain", text: "Timed out" });
    else if (res.error) summary = h("span", { class: "chip bad plain", text: "Error" });
    else if (res.submit && res.allPass) summary = h("span", { class: "chip ok plain", text: "Passed" });
    else if (failed) summary = h("span", { class: "chip bad plain", text: "Failing" });
    else summary = h("span", { class: "chip ok plain", text: "Looks good" });
    const counts = results.length ? `${passed} passed${failed ? ", " + failed + " failed" : ""}` : "";
    el.append(h("div", { class: "out-summary" }, summary, h("span", { class: "tabnum", text: counts }), ms ? h("span", { class: "ms", text: "in " + ms }) : null));

    if (res.submit && res.allPass) {
      const next = S.plan.exercises[S.index + 1];
      el.append(h("div", { class: "notice ok", text: next ? "All " + results.length + " tests pass. Exercise " + (S.index + 2) + " is unlocked." : "All tests pass. That was the last exercise." }));
    } else if (!res.submit && !res.error && !failed && results.length) {
      el.append(h("p", { class: "muted", style: "font-size: 13px", text: "Visible tests pass. Submit runs the hidden tests too." }));
    }

    if (res.error) el.append(h("pre", { class: "term err", text: res.error }));

    if (results.length) {
      const list = h("div", { class: "tests" });
      for (const r of results) {
        const icon = r.status === "pass" ? "✓" : r.status === "fail" ? "✗" : "!";
        let call;
        let detail = null;
        if (r.hidden) {
          call = "Hidden test " + (r.index + 1);
          if (r.status !== "pass") detail = r.status === "error" ? (r.message || "").split("\n").pop() : "Returned a wrong value. Inputs are hidden.";
        } else {
          call = callText(ex.function_name, r.args);
          if (r.status === "pass") detail = "→ " + r.expected;
          else if (r.status === "fail") detail = "expected " + r.expected + "\n     got " + r.actual;
          else detail = r.message;
        }
        list.append(h("div", { class: "test " + r.status },
          h("span", { class: "icon", "aria-label": r.status, text: icon }),
          h("div", { style: "min-width: 0" }, h("div", { class: "call", text: call }), detail ? h("div", { class: "detail", text: detail }) : null),
        ));
      }
      el.append(list);
    }
    if (res.stdout) el.append(h("div", { class: "stack", style: "gap: 6px" }, h("span", { class: "eyebrow", text: "Printed output" }), h("pre", { class: "term", text: res.stdout })));
    if (res.stderr) el.append(h("pre", { class: "term err", text: res.stderr }));
  }

  /* ================================================================
   * tutor
   * ================================================================ */
  function renderTutor() {
    const el = document.getElementById("tutor");
    if (!el) return;
    const ex = S.plan.exercises[S.index];
    const st = exState(ex);
    const hints = S.hints[ex.id] || [];
    const level = Math.min((st.hints_used || 0) + 1, 3);
    const keepQuestion = document.getElementById("ask") ? document.getElementById("ask").value : "";
    el.textContent = "";
    el.append(h("div", { class: "row" }, h("h3", { text: "Tutor" }), h("span", { class: "spacer" }),
      ai.available ? h("span", { class: "muted tabnum", style: "font-size: 13px", text: "Hints used: " + (st.hints_used || 0) }) : null));

    for (const hint of hints) {
      const body = h("div", { class: "body" });
      if (hint.error) body.append(h("span", { text: hint.error }));
      else body.append(hint.text ? md(hint.text) : h("span", { class: "muted", text: "Thinking…" }));
      el.append(h("div", { class: "hint" + (hint.streaming ? " streaming" : "") },
        h("span", { class: "who", text: "Hint " + hint.level }),
        hint.question ? h("span", { class: "q", text: "You asked: " + hint.question }) : null,
        body,
      ));
    }

    if (ai.available) {
      const input = h("input", { type: "text", id: "ask", maxlength: "500", placeholder: "Optional: ask a specific question", autocomplete: "off", value: keepQuestion });
      const btn = h("button", { class: "btn secondary", type: "button", disabled: S.helping, text: S.helping ? "Thinking…" : hints.length ? "Next hint (" + level + " of 3)" : "Help me" });
      const ask = () => doHelp(input.value.trim());
      btn.addEventListener("click", ask);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ask(); } });
      el.append(h("div", { class: "tutor-ask" }, input, btn));
    } else {
      el.append(h("p", { class: "muted", text: "The tutor needs Claude access, which is off for this page." }));
    }

    const allowSolution = (st.hints_used || 0) >= SOLUTION_AFTER || (st.attempts || 0) >= SOLUTION_AFTER || st.status === "solution_shown";
    if (S.showSolution[ex.id] || st.status === "solution_shown") {
      el.append(h("div", { class: "stack", style: "gap: 8px" },
        h("span", { class: "eyebrow", text: "Reference solution" }),
        h("pre", { class: "term", text: ex.reference_solution }),
        h("div", { class: "row" }, h("button", { class: "btn secondary", type: "button", onclick: () => { editor.setValue(ex.reference_solution); editor.focus(); }, text: "Copy into editor" })),
      ));
    } else if (allowSolution) {
      if (S.confirm === "solution") {
        el.append(h("div", { class: "confirm" },
          h("span", { text: "This marks the exercise as completed with the solution. Show it?" }),
          h("span", { class: "spacer" }),
          h("button", { class: "btn", type: "button", onclick: revealSolution, text: "Show solution" }),
          h("button", { class: "btn secondary", type: "button", onclick: () => { S.confirm = null; renderTutor(); }, text: "Cancel" }),
        ));
      } else {
        el.append(h("div", { class: "row" }, h("button", { class: "btn ghost", type: "button", onclick: () => { S.confirm = "solution"; renderTutor(); }, text: "Show solution…" })));
      }
    }
  }

  function revealSolution() {
    const ex = S.plan.exercises[S.index];
    const st = exState(ex);
    S.confirm = null;
    S.showSolution[ex.id] = true;
    if (st.status !== "passed") st.status = "solution_shown";
    unlockNext(S.index);
    saveProgressNow();
    renderStrip();
    renderBanner();
    renderActions();
    renderOutput();
    renderTutor();
  }

  async function doHelp(question) {
    if (S.helping || !ai.available) return;
    const ex = S.plan.exercises[S.index];
    const st = exState(ex);
    const level = Math.min((st.hints_used || 0) + 1, 3);
    const hint = { level, question, text: "", streaming: true, error: null };
    (S.hints[ex.id] = S.hints[ex.id] || []).push(hint);
    S.helping = true;
    const ask = document.getElementById("ask");
    if (ask) ask.value = "";
    renderTutor();
    let pendingFrame = false;
    try {
      const res = await ai.help({ exercise: ex, code: editor.getValue(), run: S.lastRun[ex.id], level, question }, {
        onText: ({ text }) => {
          hint.text = text;
          if (!pendingFrame) {
            pendingFrame = true;
            requestAnimationFrame(() => { pendingFrame = false; if (S.plan && S.plan.exercises[S.index] === ex) renderTutor(); });
          }
        },
      });
      hint.text = res.text;
      st.hints_used = level;
      saveProgressNow();
    } catch (e) {
      hint.error = aiErrorMessage(e);
      if (e && e.text) hint.text = e.text;
      if (e && e.code === "not_granted") ai.init(null);
    }
    hint.streaming = false;
    S.helping = false;
    if (S.plan && S.plan.exercises[S.index] === ex) renderTutor();
  }

  /* ================================================================
   * views: complete
   * ================================================================ */
  function renderComplete() {
    if (saveTimer) saveProgressNow();
    editor = null;
    const plan = S.plan;
    const states = plan.exercises.map((ex) => exState(ex));
    const passed = states.filter((s) => s.status === "passed").length;
    const withSolution = states.filter((s) => s.status === "solution_shown").length;
    const hints = states.reduce((n, s) => n + (s.hints_used || 0), 0);
    setCrumb(plan.topic + " · complete");
    viewEl.textContent = "";
    viewEl.append(h("div", { class: "complete" },
      h("div", { class: "stack", style: "gap: 6px" },
        h("p", { class: "eyebrow", text: plan.level + " · plan complete" }),
        h("h1", { text: plan.topic }),
        plan.summary ? h("p", { class: "muted", text: plan.summary }) : null,
      ),
      h("div", { class: "stats" },
        h("div", { class: "stat" }, h("b", { text: String(passed) }), h("span", { text: "solved on your own" })),
        h("div", { class: "stat" }, h("b", { text: String(withSolution) }), h("span", { text: "completed with the solution" })),
        h("div", { class: "stat" }, h("b", { text: String(hints) }), h("span", { text: "hints used" })),
      ),
      h("section", { class: "panel" }, h("ol", { class: "recap" }, plan.exercises.map((ex, i) => {
        const s = states[i];
        return h("li", {},
          h("span", { class: "chip plain " + (s.status === "passed" ? "ok" : "warn"), text: s.status === "passed" ? "Solved" : "Solution" }),
          h("strong", { text: ex.title }),
          h("span", { class: "muted", text: ex.concept }),
          h("span", { class: "spacer" }),
          h("button", { class: "btn ghost", type: "button", onclick: () => openExercise(i), text: "Open" }),
        );
      }))),
      h("div", { class: "row" },
        h("button", { class: "btn", type: "button", onclick: () => goHome(), text: "Back to plans" }),
      ),
    ));
  }

  /* ================================================================
   * boot
   * ================================================================ */
  async function boot() {
    renderHome();
    runner.start();
    const caps = await resolveCaps();
    if (!caps.db) {
      S.blocked = window.claude && window.claude.use
        ? { title: "Sign in to save your progress", body: "CodingHost stores your plans and progress in your claude.ai account. Sign in to claude.ai and open this page again." }
        : { title: "Open this page in claude.ai", body: "CodingHost uses Claude to write exercises and saves your progress to your claude.ai account. Open this page in claude.ai while signed in." };
      renderHome();
      return;
    }
    let uid = null;
    try { uid = caps.user ? await caps.user.id() : null; } catch (e) { uid = null; }
    if (!uid) {
      S.blocked = { title: "Sign in to save your progress", body: "CodingHost keeps your plans private to your account, so it needs to know who you are. Sign in to claude.ai and open this page again." };
      renderHome();
      return;
    }
    S.caps = caps;
    S.uid = uid;
    store.init(caps.db, uid);
    ai.init(caps.sample);
    await goHome();
  }

  boot();
})();
</script>
