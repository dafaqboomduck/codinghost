<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CodingHost</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/styles.css">

<header class="topbar">
  <div class="wrap">
    <button class="brand" id="brand" type="button">Coding<span>Host</span></button>
    <div class="crumb" id="crumb"></div>
    <span class="chip" id="py-chip">Python loading</span>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap debug-foot">
  <button class="btn ghost" id="debug-toggle" type="button" aria-expanded="false" aria-controls="debug-panel">Debug log</button>
  <section class="panel debug-panel" id="debug-panel" hidden>
    <div class="row">
      <h3>Debug log</h3>
      <span class="spacer"></span>
      <button class="btn secondary" id="debug-copy" type="button">Copy log</button>
    </div>
    <p class="muted" id="debug-meta"></p>
    <pre class="term" id="debug-lines"></pre>
  </section>
</footer>
<div class="toast" id="toast" role="status" hidden></div>

<script type="text/x-python" id="py-harness" src="../py/harness.py"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/addon/selection/active-line.min.js"></script>
<!-- App code. build.py joins every data-bundle script, in this order, into one
     strict-mode IIFE so the files share one private scope. -->
<script src="../js/config.js" data-bundle></script>
<script src="../js/helpers.js" data-bundle></script>
<script src="../js/dbg.js" data-bundle></script>
<script src="../js/runner.js" data-bundle></script>
<script src="../js/caps.js" data-bundle></script>
<script src="../js/store.js" data-bundle></script>
<script src="../js/ai.js" data-bundle></script>
<script src="../js/plan-checks.js" data-bundle></script>
<script src="../js/ui-state.js" data-bundle></script>
<script src="../js/progress.js" data-bundle></script>
<script src="../js/views/home.js" data-bundle></script>
<script src="../js/views/generating.js" data-bundle></script>
<script src="../js/views/exercise.js" data-bundle></script>
<script src="../js/tutor.js" data-bundle></script>
<script src="../js/views/complete.js" data-bundle></script>
<script src="../js/debug-panel.js" data-bundle></script>
<script src="../js/boot.js" data-bundle></script>

</body></html>
