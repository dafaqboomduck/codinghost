<title>Pyodide Smoke Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  /* Layout: one narrow column, a results table, a raw log below. */
  :root {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --fg: #161a26;
    --muted: #5a6274;
    --border: #d8dce5;
    --accent: #3346d3;
    --ok: #1d7a46;
    --bad: #b42335;
    --wait: #8a5a00;
    --font-body: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141b; --surface: #181c25; --fg: #e6e8ee; --muted: #9aa2b4;
      --border: #2a3040; --accent: #8c9bff; --ok: #5fcf8c; --bad: #ff7a8a; --wait: #e8b54a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141b; --surface: #181c25; --fg: #e6e8ee; --muted: #9aa2b4;
    --border: #2a3040; --accent: #8c9bff; --ok: #5fcf8c; --bad: #ff7a8a; --wait: #e8b54a;
    color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 48px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
  h1 { font-size: 22px; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); max-width: 65ch; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.ms { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st { font-weight: 600; white-space: nowrap; }
  .st.pass { color: var(--ok); } .st.fail { color: var(--bad); } .st.wait { color: var(--wait); }
  .err { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
  pre#log { margin: 0; padding: 12px; font: 12px/1.5 var(--font-mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button {
    font: 600 14px var(--font-body); padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: var(--surface);
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #verdict { font-weight: 600; }
</style>

<main>
  <div class="row" style="justify-content: space-between">
    <h1>Pyodide smoke test</h1>
    <div class="row">
      <button id="rerun" type="button">Run again</button>
      <button id="copy" type="button" class="secondary">Copy results</button>
    </div>
  </div>
  <p>Checks whether Pyodide 0.26.4 can run Python inside this artifact. Each row loads Python a different way and runs <code>print(1 + 1)</code>. Expected output is <code>2</code>.</p>
  <p id="verdict">Running…</p>
  <div class="card">
    <table>
      <thead><tr><th>Check</th><th>Result</th><th>Time</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="card"><pre id="log"></pre></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js"></script>
<script>
(function () {
  const CDN = "https://cdn.jsdelivr.net/npm/pyodide@0.26.4/";
  const SELF = new URL("pyodide/", location.href).href;
  const TIMEOUT_MS = 60000;
  const PY = "import io, contextlib\nb = io.StringIO()\nwith contextlib.redirect_stdout(b):\n    print(1 + 1)\nb.getvalue().strip()";

  const rowsEl = document.getElementById("rows");
  const logEl = document.getElementById("log");
  const verdictEl = document.getElementById("verdict");
  const results = [];
  const violations = [];

  function log(line) {
    logEl.textContent += line + "\n";
  }

  document.addEventListener("securitypolicyviolation", (e) => {
    const v = `CSP blocked ${e.effectiveDirective}: ${e.blockedURI}`;
    violations.push(v);
    log(v);
  });

  function withTimeout(promise, ms, label) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error(label + " timed out after " + ms + " ms")), ms)),
    ]);
  }

  function addRow(name) {
    const tr = document.createElement("tr");
    const tdName = document.createElement("td");
    const tdSt = document.createElement("td");
    const tdMs = document.createElement("td");
    tdName.textContent = name;
    tdMs.className = "ms";
    const st = document.createElement("div");
    st.className = "st wait";
    st.textContent = "Running";
    tdSt.append(st);
    tr.append(tdName, tdSt, tdMs);
    rowsEl.append(tr);
    return {
      done(ok, ms, detail) {
        st.className = "st " + (ok ? "pass" : "fail");
        st.textContent = ok ? "Pass" : "Fail";
        tdMs.textContent = ms == null ? "" : Math.round(ms) + " ms";
        if (detail) {
          const d = document.createElement("div");
          d.className = "err";
          d.textContent = detail;
          tdSt.append(d);
        }
        results.push({ name, ok, ms: ms == null ? null : Math.round(ms), detail: detail || "" });
        log(`${ok ? "PASS" : "FAIL"} ${name}${ms == null ? "" : " (" + Math.round(ms) + " ms)"}${detail ? ": " + detail : ""}`);
      },
    };
  }

  // Artifacts do not serve .zip, so the stdlib ships as base64 text.
  // The function is also copied into the worker source with toString().
  async function stdlibBlobURL(base) {
    const res = await fetch(base + "python_stdlib.zip.b64.txt");
    if (!res.ok) throw new Error("stdlib fetch failed: HTTP " + res.status);
    const bin = atob((await res.text()).trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return URL.createObjectURL(new Blob([bytes], { type: "application/zip" }));
  }

  async function mainThread(indexURL, selfHosted) {
    if (typeof loadPyodide !== "function") throw new Error("loadPyodide is not defined (pyodide.js did not load)");
    const opts = { indexURL };
    if (selfHosted) opts.stdLibURL = await stdlibBlobURL(indexURL);
    const py = await loadPyodide(opts);
    return py.runPython(PY);
  }

  const WORKER_SRC = stdlibBlobURL.toString() + `
    const violations = [];
    self.addEventListener("securitypolicyviolation", (e) => violations.push(e.effectiveDirective + ": " + e.blockedURI));
    self.onmessage = async (e) => {
      const { script, indexURL, code, selfHosted } = e.data;
      try {
        importScripts(script);
        const opts = { indexURL };
        if (selfHosted) opts.stdLibURL = await stdlibBlobURL(indexURL);
        const py = await loadPyodide(opts);
        postMessage({ ok: true, out: py.runPython(code), violations });
      } catch (err) {
        postMessage({ ok: false, error: String((err && err.message) || err), violations });
      }
    };`;
  const workerURL = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));

  function inWorker(script, indexURL) {
    const selfHosted = indexURL === SELF;
    const w = new Worker(workerURL);
    const p = new Promise((resolve, reject) => {
      w.onmessage = (e) => {
        (e.data.violations || []).forEach((v) => log("worker CSP blocked " + v));
        e.data.ok ? resolve({ out: e.data.out, worker: w }) : reject(new Error(e.data.error));
      };
      w.onerror = (e) => reject(new Error("worker error: " + (e.message || "unknown")));
    });
    w.postMessage({ script, indexURL, code: PY, selfHosted });
    return p.catch((err) => { w.terminate(); throw err; });
  }

  async function check(name, fn) {
    const row = addRow(name);
    const t0 = performance.now();
    try {
      const out = await withTimeout(fn(), TIMEOUT_MS, name);
      const ms = performance.now() - t0;
      out === "2" ? row.done(true, ms, "") : row.done(false, ms, "Unexpected output: " + JSON.stringify(out));
      return true;
    } catch (err) {
      row.done(false, performance.now() - t0, String((err && err.message) || err));
      return false;
    }
  }

  async function run() {
    rowsEl.textContent = "";
    logEl.textContent = "";
    results.length = 0;
    violations.length = 0;
    verdictEl.textContent = "Running…";
    log("page: " + location.origin);
    log("WebAssembly: " + (typeof WebAssembly === "object" ? "available" : "missing"));
    log("Worker: " + (typeof Worker === "function" ? "available" : "missing"));

    let goodWorker = null;
    const mainSelf = await check("Main thread, files published with the page", () => mainThread(SELF, true));
    const mainCdn = await check("Main thread, files from jsDelivr", () => mainThread(CDN, false));
    const workerSelf = await check("Web Worker, files published with the page", async () => {
      const r = await inWorker(SELF + "pyodide.js", SELF);
      r.worker.terminate();
      goodWorker = goodWorker || [SELF + "pyodide.js", SELF];
      return r.out;
    });
    const workerCdn = await check("Web Worker, files from jsDelivr", async () => {
      const r = await inWorker(CDN + "pyodide.js", CDN);
      r.worker.terminate();
      goodWorker = goodWorker || [CDN + "pyodide.js", CDN];
      return r.out;
    });
    let restart = false;
    if (goodWorker) {
      restart = await check("Worker terminate, then a fresh worker runs again", async () => {
        const a = await inWorker(goodWorker[0], goodWorker[1]);
        a.worker.terminate();
        const b = await inWorker(goodWorker[0], goodWorker[1]);
        b.worker.terminate();
        return b.out;
      });
    } else {
      addRow("Worker terminate, then a fresh worker runs again").done(false, null, "Skipped: no worker variant loaded.");
    }

    let verdict;
    if ((workerSelf || workerCdn) && restart) verdict = "Worker design works. Continue with the app as specified.";
    else if (mainSelf || mainCdn) verdict = "Only the main thread works. The app falls back to a main-thread runner with a step-guard timeout.";
    else verdict = "Python does not load in this artifact. Switch to the MCP App fallback.";
    verdictEl.textContent = verdict;
    log("VERDICT: " + verdict);
    if (violations.length) log(violations.length + " CSP violation(s) on the page.");
  }

  document.getElementById("rerun").addEventListener("click", run);
  document.getElementById("copy").addEventListener("click", async () => {
    const text = logEl.textContent;
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById("copy").textContent = "Copied";
    } catch (e) {
      const range = document.createRange();
      range.selectNodeContents(logEl);
      const sel = getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      document.getElementById("copy").textContent = "Selected, press Ctrl+C";
    }
  });

  run();
})();
</script>
